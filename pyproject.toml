[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[project]
name = "trello-axi"
version = "0.3.0"
description = "Agent-native, token-efficient CLI for Trello"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
trello-axi = "trello_axi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.36.2",
    "ruff>=0.12",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]
